name: Observer snapshot
on:
  workflow_dispatch:
    inputs:
      cortex:
        description: 'Authorize one Octopus research request (API usage may incur costs)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: observer-snapshot
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile observer.py octopus_adapter.py memory.py paper.py
      - run: python -m unittest discover
      - run: python paper.py
      - name: Observe market
        id: scan
        continue-on-error: true
        run: python observer.py
      - name: Record decisions and history
        run: python memory.py
      - name: Research hypotheses
        if: inputs.cortex && steps.scan.outcome == 'success'
        env:
          OCTOPUS_ENGINE_URL: ${{ vars.OCTOPUS_ENGINE_URL || secrets.OCTOPUS_ENGINE_URL || 'https://octopus-engine-app.benoitlubert.workers.dev' }}
          OCTOPUS_AUTHORIZATION: ${{ secrets.OCTOPUS_AUTHORIZATION }}
        run: python octopus_adapter.py
      - name: Persist observation including errors
        run: |
          test -f docs/status.json
          git config user.name "Octopus Observer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status.json docs/history.json
          if test -f docs/cortex.json; then git add docs/cortex.json; fi
          git diff --cached --quiet || git commit -m "Observer market snapshot"
          git push
      - name: Report failed Cortex research
        if: inputs.cortex && steps.scan.outcome == 'success'
        run: python -c "import json; d=json.load(open('docs/cortex.json')); print(d['status']); assert d['status']=='proposed', d.get('http_status',d['status'])"
      - name: Report failed collection
        if: steps.scan.outcome == 'failure'
        run: exit 1
