name: Validate Octopus
on:
  push:
    paths:
      - '**.py'
      - '.github/workflows/validate.yml'
  workflow_dispatch:
    inputs:
      observe:
        description: 'Run read-only market observation'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile paper.py observer.py
      - run: python paper.py
      - if: github.event_name == 'workflow_dispatch' && inputs.observe
        run: python observer.py
      - if: always() && github.event_name == 'workflow_dispatch' && inputs.observe
        uses: actions/upload-artifact@v4
        with:
          name: market-observations
          path: docs/status.json
