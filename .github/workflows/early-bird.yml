name: Early Bird observation
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: early-bird
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python early_bird.py
      - run: |
          git config user.name "Gege Early Bird"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/early_bird.json
          git diff --cached --quiet || git commit -m "Early Bird observation"
          for attempt in 1 2 3 4 5; do
            git pull --rebase || exit 1
            if git push; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
