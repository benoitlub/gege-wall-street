name: Gauss historical laboratory
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: write
concurrency:
  group: gauss-lab
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover
      - name: Historical benchmarks
        id: lab
        continue-on-error: true
        run: python historical_lab.py
      - name: Publish research report
        run: |
          git config user.name "Gauss Laboratory"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/backtest.json
          git diff --cached --quiet || git commit -m "Gauss historical research report"
          for attempt in 1 2 3 4 5; do
            git pull --rebase || exit 1
            if git push; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
      - name: Verify collection
        if: steps.lab.outcome == 'failure'
        run: exit 1
