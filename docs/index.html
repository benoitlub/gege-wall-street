<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gégé Wall Street</title><style>
*{box-sizing:border-box}body{margin:0;background:#030914;color:#d8f5ff;font:16px system-ui}canvas{position:fixed;inset:0;width:100%;height:100%;z-index:-1}main{max-width:1100px;margin:auto;padding:24px}header{letter-spacing:3px}small{color:#86a7ba}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}article{background:#071727dd;border:1px solid #346078;border-radius:16px;padding:18px;backdrop-filter:blur(8px)}strong{display:block;font-size:28px;margin-top:8px}footer{margin-top:55vh;background:#071727dd;padding:18px;border-radius:16px}h1{font-size:clamp(24px,5vw,42px)} </style><canvas id="scene"></canvas><main><header>OCTOPUS FINANCE · V0.3</header><h1>Gégé Wall Street</h1><p><span id='status'>En attente des observations</span></p><section class="grid"><article><small>Capital initial prévu</small><strong>100 €</strong></article><article><small>Valeur actuelle</small><strong>—</strong></article><article><small>Tokens observés</small><strong id='count'>—</strong></article><article><small>Mode</small><strong>Paper</strong></article></section><footer>Guardian · aucune transaction réelle possible dans le moteur actuel.<br><small>Animation décorative uniquement. Aucune activité de marché n'est simulée à l'écran.</small><p id='date'></p><div id='observations'></div></footer></main><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const scene=new T.Scene(), camera=new T.PerspectiveCamera(45,innerWidth/innerHeight,.1,100), renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));camera.position.z=17;
const group=new T.Group();scene.add(group);group.position.y=-.8;
const skin=new T.MeshStandardMaterial({color:0x18366d,metalness:.65,roughness:.3,emissive:0x101039});
const head=new T.Mesh(new T.SphereGeometry(1.65,48,32),skin);head.scale.set(1,1.15,.85);head.position.y=1;group.add(head);
const glow=new T.MeshBasicMaterial({color:0x68dcff});for(const s of [-1,1]){const eye=new T.Mesh(new T.SphereGeometry(.22,24,16),glow);eye.position.set(s*.83,.85,1.3);group.add(eye)}
const arms=[];for(let i=0;i<8;i++){const a=i*Math.PI/4, arm=new T.Group();group.add(arm);arms.push(arm);const pts=[];for(let j=0;j<=40;j++){const t=j/40,r=1+4.3*t,b=a+.65*Math.sin(t*4);pts.push(new T.Vector3(Math.cos(b)*r,Math.sin(b)*r-.5,Math.sin(t*5+i)*.6))}const curve=new T.CatmullRomCurve3(pts);arm.add(new T.Mesh(new T.TubeGeometry(curve,64,.17,10,false),skin));for(let j=3;j<38;j+=3){const ring=new T.Mesh(new T.TorusGeometry(.13,.035,8,16),glow);ring.position.copy(pts[j]);ring.position.z+=.16;arm.add(ring)}}
scene.add(new T.AmbientLight(0x6379ff,2));const light=new T.PointLight(0x9a65ff,80);light.position.set(2,3,5);scene.add(light);const l2=new T.PointLight(0x24dfff,60);l2.position.set(-4,-2,4);scene.add(l2);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.position.z=innerWidth<600?24:17;camera.updateProjectionMatrix()}resize();addEventListener('resize',resize);let x=0,y=0;addEventListener('pointermove',e=>{x=(e.clientX/innerWidth-.5)*.22;y=(e.clientY/innerHeight-.5)*.22});const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;renderer.setAnimationLoop(ms=>{const t=reduced?0:ms*.001;group.rotation.y+=(x-group.rotation.y)*.04;group.rotation.x+=(y-group.rotation.x)*.04;arms.forEach((a,i)=>a.rotation.z=.045*Math.sin(t+i));renderer.render(scene,camera)});
</script><script>
async function refresh(){
 const status=document.getElementById('status'), list=document.getElementById('observations');
 try{
 const r=await fetch('./status.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);
 const d=await r.json();if(!Array.isArray(d.observations))throw Error('Invalid observations');
 status.textContent=d.status==='observed'?'Dernière collecte disponible':'Collecte en erreur : '+(d.error||'inconnue');
 document.getElementById('date').textContent='Collecte UTC : '+d.timestamp;
 document.getElementById('count').textContent=d.observations.length;
 list.replaceChildren();
 for(const o of d.observations){const p=document.createElement('p');p.textContent=(o.symbol||o.address)+' · '+o.decision+' · '+o.reason;list.append(p);}
 }catch(e){status.textContent='Données indisponibles : '+e.message;document.getElementById('count').textContent='—';list.replaceChildren();document.getElementById('date').textContent='';}
}
refresh();setInterval(refresh,60000);
</script></html>
